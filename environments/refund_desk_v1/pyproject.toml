[project]
name = "refund-desk-v1"
version = "0.2.0"
description = "Support-desk prompt-injection resistance: do the legitimate refund, ignore the attack. Reward replays tool calls through a deterministic twin and rule-based oracle (LIFE FORGE)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Zarif Latif"}]
keywords = ["verifiers", "environment", "prompt-injection", "agent-safety", "tool-use", "rl-environment"]
requires-python = ">=3.11"
dependencies = [
    "verifiers",
    "lifeforge>=0.4.2",
]

[project.urls]
Source = "https://github.com/zariffromlatif/life-forge/tree/main/environments/refund_desk_v1"
Issues = "https://github.com/zariffromlatif/life-forge/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["refund_desk_v1"]
