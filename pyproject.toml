[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lifeforge"
version = "0.1.0"
description = "A research framework for artificial life and cellular automata."
requires-python = ">=3.13"
dependencies = [
    "numpy",
]

[tool.setuptools.packages.find]
include = ["lifeforge*"]