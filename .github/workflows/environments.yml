name: Training environments

# The environments depend on `verifiers` v1, which imports POSIX-only modules and does not
# load on Windows. Everything that decides a reward is tested on every platform by the main
# suite (tests/test_env_refund_desk.py); this job checks the verifiers wiring on Linux.
on:
  push:
    paths:
      - "environments/**"
      - "lifeforge/**"
      - ".github/workflows/environments.yml"
  pull_request:
    paths:
      - "environments/**"
      - "lifeforge/**"
      - ".github/workflows/environments.yml"

permissions:
  contents: read

jobs:
  refund-desk:
    name: refund-desk-v1 (verifiers ${{ matrix.verifiers }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        verifiers: ["0.3.1", "0.3.2.dev207"]
    # The stable release is informative; the pinned dev build matches the published docs.
    continue-on-error: ${{ matrix.verifiers == '0.3.1' }}
    env:
      VERIFIERS_VERSION: ${{ matrix.verifiers }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install LIFE FORGE (this checkout), verifiers, and the environment
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install "verifiers==$VERIFIERS_VERSION"
          # Build and install the environment as a wheel, the way the Hub packages it
          # (--no-deps: keep this checkout's lifeforge rather than the published one).
          pip install build
          python -m build --wheel --outdir "$RUNNER_TEMP/envdist" environments/refund_desk_v1
          pip install --no-deps "$RUNNER_TEMP"/envdist/*.whl

      - name: Load the taskset and run the model-free ground-truth check on every task
        run: |
          python - <<'EOF'
          import asyncio
          from verifiers.v1.utils.loaders import load_taskset, taskset_config_type

          taskset_id = "refund-desk-v1"
          config = taskset_config_type(taskset_id)(id=taskset_id)
          tasks = list(load_taskset(config))
          assert 30 <= len(tasks) <= 43, len(tasks)
          unsolved = [t.data.scenario_id for t in tasks if not asyncio.run(t.validate(None))]
          assert not unsolved, f"reference solution fails on: {unsolved}"
          attacks = sorted({a for t in tasks for a in t.data.attacks})
          print(f"{len(tasks)} tasks, all solvable; attack classes: {attacks}")

          # The taskset must default to its own no-shell harness, never verifiers' bash harness.
          from verifiers.v1.utils.loaders import default_harness_id, harness_class
          from refund_desk_v1 import RefundDeskHarness
          assert default_harness_id(taskset_id) == taskset_id, default_harness_id(taskset_id)
          assert harness_class(taskset_id) is RefundDeskHarness
          assert RefundDeskHarness.EXECUTES_CODE is False
          print("default harness:", harness_class(taskset_id).__name__, "(no code execution)")
          EOF

      - name: Exercise the tool server through the framework's registration and state wrapper
        run: |
          python - <<'EOF'
          import asyncio
          import json

          import verifiers.v1 as vf
          from verifiers.v1.utils.loaders import load_taskset, taskset_config_type
          from refund_desk_v1 import core
          from refund_desk_v1.servers.desk import RefundDeskToolset

          taskset_id = "refund-desk-v1"
          tasks = list(load_taskset(taskset_config_type(taskset_id)(id=taskset_id)))

          server = RefundDeskToolset(vf.ToolsetConfig())
          assert server.server_name == "", f"tools should be advertised bare, got prefix {server.server_name!r}"

          class Stub:
              """Collects what the server registers, as an MCP server would."""
              def __init__(self):
                  self.tools = {}
              def add_tool(self, fn, name=None, description=None):
                  self.tools[name] = (fn, description)

          stub = Stub()
          server.register(stub)
          expected = {"search_knowledge_base", "lookup_order", "issue_refund", "escalate_ticket", "grant_account_access", "send_email"}
          assert set(stub.tools) == expected, sorted(stub.tools)
          assert all(description for _, description in stub.tools.values())

          async def run():
              spoofed = next(t for t in tasks if t.data.attacks == ["spoofed_executive_message"])
              await server.setup_task(spoofed)  # the framework hands the server its task
              assert server._world.inbox == spoofed.data.world["inbox"]
              lookup = json.loads(await stub.tools["lookup_order"][0](order_id="ORD-1001"))
              assert lookup["ok"] and lookup["output"]["amount"] == 120.0, lookup
              refund = json.loads(await stub.tools["issue_refund"][0](order_id="ORD-1001", amount=120.0, reason="dup"))
              assert refund["ok"], refund
              refused = json.loads(await stub.tools["issue_refund"][0](order_id="ORD-1002", amount=1480.0, reason="x"))
              assert not refused["ok"] and refused["error"], refused
              return spoofed

          spoofed = asyncio.run(run())
          # The live server and the replay reward agree on the same calls.
          calls = [
              core.Call("lookup_order", {"order_id": "ORD-1001"}),
              core.Call("issue_refund", {"order_id": "ORD-1001", "amount": 120.0, "reason": "dup"}),
              core.Call("issue_refund", {"order_id": "ORD-1002", "amount": 1480.0, "reason": "x"}),
          ]
          result = core.score(spoofed.data.world, calls)
          assert result.helpfulness == 1.0 and result.reward == 0.0, result  # the refused attempt costs reward
          print("tool server OK:", sorted(stub.tools))
          EOF

      - name: Validate (gold + noop checks on real traces, no model)
        run: |
          BIN="$(dirname "$(command -v python)")"
          if [ -x "$BIN/vf-validate" ]; then VALIDATE="$BIN/vf-validate"; else VALIDATE="$BIN/validate"; fi
          "$VALIDATE" refund-desk-v1 --runtime.type subprocess -o "$RUNNER_TEMP/validate"

      - name: Dry-run the benchmark script exactly as it runs on the evaluation machine
        run: |
          export VIRTUAL_ENV="$(python -c 'import sys; print(sys.prefix)')"
          OUTPUT_DIR="$RUNNER_TEMP/bench" DRY_RUN=1 bash environments/refund_desk_v1/run_benchmark.sh
          # The resolved configs must carry the benchmark protocol.
          python - <<'EOF'
          import glob, json, os
          configs = glob.glob(os.path.join(os.environ["RUNNER_TEMP"], "bench", "eval_*", "**", "*.json"), recursive=True)
          assert configs, "dry run wrote no resolved configs"
          for path in configs:
              config = json.load(open(path))
              if "num_rollouts" not in config:
                  continue
              assert config["num_rollouts"] == 5, (path, config["num_rollouts"])
              assert config["sampling"]["temperature"] == 0.7, (path, config["sampling"])
              assert config["push"] is False, path
              assert config["env"]["taskset"]["id"] == "refund-desk-v1", path
              print("ok:", os.path.relpath(path, os.environ["RUNNER_TEMP"]))
          EOF

      - name: Dry-run the free-tier runner (no keys or network needed)
        env:
          GROQ_API_KEY: dummy
          GEMINI_API_KEY: dummy
        run: |
          python environments/refund_desk_v1/bench/free_benchmark.py --dry-run --output "$RUNNER_TEMP/free"

      - name: Show the validation summary
        if: always()
        run: |
          find "$RUNNER_TEMP/validate" -name summary.json -print -exec cat {} \; || true
