name: AI Agent Flight Simulator CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-suite:
    name: Test Suite (${{ matrix.os }} - Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
          pip install pytest

      - name: Run Test Suite
        run: |
          pytest -v

  agent-stress-fuzzing:
    name: Automated Evolutionary Agent Fuzzing
    runs-on: ubuntu-latest
    needs: test-suite
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Run Evolutionary Stress Test (Hardened Reference Agent)
        run: |
          python -m lifeforge.cli test --scenarios 30 --hardened --out results/hardened_audit_report.md --json

      - name: Run CA Substrate & MODES Survey
        run: |
          python -m lifeforge.cli run --substrate totalistic --steps 100
          python -m lifeforge.cli survey --count 20 --steps 50 --db results/ci_survey.jsonl

      - name: Upload Audit Reports & Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lifeforge-ci-audit-reports
          path: |
            results/*.md
            results/*.json
            results/*.jsonl

  action-gatekeeper-dogfooding:
    name: Turnkey GitHub Action (Dogfooding)
    runs-on: ubuntu-latest
    needs: test-suite
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Test Composite Action (Dogfooding)
        uses: ./
        with:
          target: "examples/custom_agent_evaluation.py:MyCustomProcurementAgent"
          scenarios: 15
          seed: 42
          fail-on-critical: "true"
          comment-on-pr: "false"
          report-path: "results/action_dogfood_audit.md"

      - name: Upload Dogfood Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifeforge-action-dogfood-report
          path: |
            results/action_dogfood_audit.md
            results/action_dogfood_audit.json

