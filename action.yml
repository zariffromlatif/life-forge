name: "LIFE FORGE AI Agent Flight Simulator"
description: "Autonomous evolutionary red-teaming and dynamic stress-testing gatekeeper for AI agents via 3D MAP-Elites. Modes: eval (red-team an agent), surface (failure-surface diff gate), mcp-scan (MCP tool-definition security scan)."
author: "Zarif Latif"
branding:
  icon: "shield"
  color: "cyan"

inputs:
  mode:
    description: "Gate mode: 'eval' (evolutionary red-team), 'surface' (failure-surface diff against a baseline), or 'mcp-scan' (MCP tool-definition security scan)"
    required: false
    default: "eval"

  # ---- Shared inputs -------------------------------------------------
  domain:
    description: "Built-in scenario domain (procurement, customer_support, devops, financial)"
    required: false
    default: ""
  domain-spec:
    description: "Path to a YAML/JSON custom domain specification (overrides 'domain')"
    required: false
    default: ""
  frontier:
    description: "Include 2026 frontier attacks (prompt worms, memory poisoning, context flood, multilingual)"
    required: false
    default: "false"
  scenarios:
    description: "Number of evolutionary generations to simulate"
    required: false
    default: "30"
  seed:
    description: "Deterministic random seed"
    required: false
    default: "42"
  fail-on-critical:
    description: "Fail the step (exit 1) when critical findings are present"
    required: false
    default: "true"
  report-path:
    description: "Output file path for the Markdown report"
    required: false
    default: "results/lifeforge_report.md"
  json:
    description: "Also generate a structured JSON report alongside the Markdown"
    required: false
    default: "true"
  comment-on-pr:
    description: "Post the report as a PR comment"
    required: false
    default: "true"
  github-token:
    description: "GitHub token for commenting on PRs and uploading summaries"
    required: false
    default: ${{ github.token }}

  # ---- eval mode inputs ----------------------------------------------
  target:
    description: "[eval] Target Python agent specifier (e.g. src/agent.py:my_agent or module:AgentClass)"
    required: false
    default: ""
  endpoint:
    description: "[eval] HTTP webhook URL to receive observations for external/Dockerized agents"
    required: false
    default: ""
  reset-endpoint:
    description: "[eval] Optional HTTP reset URL for external microservice agents"
    required: false
    default: ""
  timeout:
    description: "[eval] HTTP request timeout in seconds"
    required: false
    default: "30.0"
  agent-name:
    description: "[eval] Custom identifier for the evaluated agent"
    required: false
    default: ""
  delay:
    description: "[eval] Delay in seconds between generations"
    required: false
    default: "0.0"

  # ---- surface mode inputs -------------------------------------------
  surface-baseline:
    description: "[surface] Path to the baseline failure-surface snapshot (JSON)"
    required: false
    default: ""
  surface-save-current:
    description: "[surface] Where to save the current snapshot (e.g. results/agent_surface.json; commit it to update the baseline)"
    required: false
    default: ""
  surface-fail-on-regression:
    description: "[surface] Fail the step when the failure surface regressed"
    required: false
    default: "true"
  surface-agent-target:
    description: "[surface] Agent specifier to campaign against (falls back to 'target')"
    required: false
    default: ""
  surface-endpoint:
    description: "[surface] HTTP webhook agent to campaign against (falls back to 'endpoint')"
    required: false
    default: ""
  surface-agent-name:
    description: "[surface] Label for the built-in reference agent (e.g. 'hardened' reference)"
    required: false
    default: ""
  surface-hardened:
    description: "[surface] Campaign against the hardened built-in reference agent"
    required: false
    default: "false"

  # ---- mcp-scan mode inputs ------------------------------------------
  mcp-manifest:
    description: "[mcp-scan] Path to a JSON manifest of MCP tool definitions"
    required: false
    default: ""
  mcp-server:
    description: "[mcp-scan] Command launching an MCP server over stdio (e.g. 'python server.py')"
    required: false
    default: ""
  mcp-url:
    description: "[mcp-scan] HTTP URL of an MCP Streamable-HTTP endpoint"
    required: false
    default: ""
  mcp-baseline:
    description: "[mcp-scan] Approved baseline manifest for rug-pull (drift) detection"
    required: false
    default: ""
  mcp-timeout:
    description: "[mcp-scan] Per-request timeout in seconds for live probes"
    required: false
    default: "15.0"

outputs:
  report-path:
    description: "Path to the generated Markdown report"
    value: ${{ inputs.report-path }}
  surface-verdict:
    description: "[surface mode] REGRESSED, IMPROVED, or UNCHANGED"
    value: ${{ steps.run-surface.outputs.verdict }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install LIFE FORGE
      shell: bash
      run: |
        python -m pip install --upgrade pip
        if [ -f "${{ github.action_path }}/pyproject.toml" ]; then
          pip install "${{ github.action_path }}"
        else
          pip install git+https://github.com/zariffromlatif/life-forge.git
        fi

    # ---------------------------------------------------------------
    # Mode: eval (default) - evolutionary red-team of an agent
    # ---------------------------------------------------------------
    - name: Run LIFE FORGE Agent Evaluation
      id: run-eval
      if: ${{ inputs.mode == 'eval' }}
      shell: bash
      run: |
        CMD="python -m lifeforge.cli eval --scenarios ${{ inputs.scenarios }} --seed ${{ inputs.seed }} --delay ${{ inputs.delay }} --out ${{ inputs.report-path }}"

        if [ -n "${{ inputs.target }}" ]; then
          CMD="$CMD --target ${{ inputs.target }}"
        fi

        if [ -n "${{ inputs.endpoint }}" ]; then
          CMD="$CMD --endpoint ${{ inputs.endpoint }}"
        fi

        if [ -n "${{ inputs.reset-endpoint }}" ]; then
          CMD="$CMD --reset-endpoint ${{ inputs.reset-endpoint }}"
        fi

        if [ -n "${{ inputs.timeout }}" ]; then
          CMD="$CMD --timeout ${{ inputs.timeout }}"
        fi

        if [ -n "${{ inputs.agent-name }}" ]; then
          CMD="$CMD --agent-name ${{ inputs.agent-name }}"
        fi

        if [ -n "${{ inputs.domain }}" ]; then
          CMD="$CMD --domain ${{ inputs.domain }}"
        fi

        if [ -n "${{ inputs.domain-spec }}" ]; then
          CMD="$CMD --domain-spec ${{ inputs.domain-spec }}"
        fi

        if [ "${{ inputs.frontier }}" = "true" ]; then
          CMD="$CMD --frontier"
        fi

        if [ "${{ inputs.json }}" = "true" ]; then
          CMD="$CMD --json"
        fi

        if [ "${{ inputs.fail-on-critical }}" = "true" ]; then
          CMD="$CMD --fail-on-critical"
        fi

        echo "[*] Executing: $CMD"
        $CMD

    # ---------------------------------------------------------------
    # Mode: surface - failure-surface diff gate
    # ---------------------------------------------------------------
    - name: Run LIFE FORGE Failure-Surface Gate
      id: run-surface
      if: ${{ inputs.mode == 'surface' }}
      shell: bash
      env:
        SURFACE_TARGET: ${{ inputs.surface-agent-target || inputs.target }}
        SURFACE_ENDPOINT: ${{ inputs.surface-endpoint || inputs.endpoint }}
      run: |
        if [ -z "${{ inputs.surface-baseline }}" ]; then
          echo "[FAIL] surface mode requires 'surface-baseline' (record one with: lifeforge surface --record --out results/agent_surface.json)"
          exit 1
        fi

        CMD="python -m lifeforge.cli surface --baseline ${{ inputs.surface-baseline }} --scenarios ${{ inputs.scenarios }} --seed ${{ inputs.seed }} --out ${{ inputs.report-path }}"

        if [ -n "$SURFACE_TARGET" ]; then
          CMD="$CMD --target $SURFACE_TARGET"
        elif [ -n "$SURFACE_ENDPOINT" ]; then
          CMD="$CMD --endpoint $SURFACE_ENDPOINT"
        elif [ "${{ inputs.surface-hardened }}" = "true" ]; then
          CMD="$CMD --hardened"
        elif [ -n "${{ inputs.surface-agent-name }}" ]; then
          CMD="$CMD --agent-name ${{ inputs.surface-agent-name }}"
        fi

        if [ -n "${{ inputs.surface-save-current }}" ]; then
          CMD="$CMD --save-current ${{ inputs.surface-save-current }}"
        fi

        if [ -n "${{ inputs.domain }}" ]; then
          CMD="$CMD --domain ${{ inputs.domain }}"
        fi

        if [ -n "${{ inputs.domain-spec }}" ]; then
          CMD="$CMD --domain-spec ${{ inputs.domain-spec }}"
        fi

        if [ "${{ inputs.frontier }}" = "true" ]; then
          CMD="$CMD --frontier"
        fi

        if [ "${{ inputs.json }}" = "true" ]; then
          CMD="$CMD --json"
        fi

        if [ "${{ inputs.surface-fail-on-regression }}" = "true" ]; then
          CMD="$CMD --fail-on-regression"
        fi

        echo "[*] Executing: $CMD"
        $CMD

    - name: Export surface verdict
      if: ${{ inputs.mode == 'surface' && always() }}
      shell: bash
      run: |
        VERDICT="UNKNOWN"
        if [ -f "${{ inputs.report-path }}" ]; then
          if grep -q "Verdict: REGRESSED" "${{ inputs.report-path }}"; then
            VERDICT="REGRESSED"
          elif grep -q "Verdict: IMPROVED" "${{ inputs.report-path }}"; then
            VERDICT="IMPROVED"
          elif grep -q "Verdict: UNCHANGED" "${{ inputs.report-path }}"; then
            VERDICT="UNCHANGED"
          fi
        fi
        echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
        echo "[*] Surface verdict: $VERDICT"

    # ---------------------------------------------------------------
    # Mode: mcp-scan - MCP tool-definition security scan
    # ---------------------------------------------------------------
    - name: Run LIFE FORGE MCP Security Scan
      id: run-mcp-scan
      if: ${{ inputs.mode == 'mcp-scan' }}
      shell: bash
      run: |
        SOURCE_COUNT=0
        if [ -n "${{ inputs.mcp-manifest }}" ]; then SOURCE_COUNT=$((SOURCE_COUNT+1)); fi
        if [ -n "${{ inputs.mcp-server }}" ]; then SOURCE_COUNT=$((SOURCE_COUNT+1)); fi
        if [ -n "${{ inputs.mcp-url }}" ]; then SOURCE_COUNT=$((SOURCE_COUNT+1)); fi
        if [ "$SOURCE_COUNT" -ne 1 ]; then
          echo "[FAIL] mcp-scan mode requires exactly one of: mcp-manifest, mcp-server, mcp-url"
          exit 1
        fi

        CMD="python -m lifeforge.cli mcp-scan --out ${{ inputs.report-path }}"

        if [ -n "${{ inputs.mcp-manifest }}" ]; then
          CMD="$CMD --manifest ${{ inputs.mcp-manifest }}"
        elif [ -n "${{ inputs.mcp-server }}" ]; then
          CMD="$CMD --server ${{ inputs.mcp-server }}"
        else
          CMD="$CMD --url ${{ inputs.mcp-url }}"
        fi

        if [ -n "${{ inputs.mcp-baseline }}" ]; then
          CMD="$CMD --baseline ${{ inputs.mcp-baseline }}"
        fi

        CMD="$CMD --timeout ${{ inputs.mcp-timeout }}"

        if [ "${{ inputs.json }}" = "true" ]; then
          CMD="$CMD --json"
        fi

        if [ "${{ inputs.fail-on-critical }}" = "true" ]; then
          CMD="$CMD --fail-on-critical"
        fi

        echo "[*] Executing: $CMD"
        $CMD

    # ---------------------------------------------------------------
    # Reporting (all modes)
    # ---------------------------------------------------------------
    - name: Publish Summary to GitHub Step Summary
      if: always()
      shell: bash
      run: |
        if [ -f "${{ inputs.report-path }}" ]; then
          echo "## LIFE FORGE Security Report (mode: ${{ inputs.mode }})" >> $GITHUB_STEP_SUMMARY
          cat "${{ inputs.report-path }}" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Post PR Review Comment
      if: always()
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        if [ "${{ inputs.comment-on-pr }}" = "true" ] && [ "${{ github.event_name }}" = "pull_request" ]; then
          if [ -f "${{ inputs.report-path }}" ] && [ -n "${{ github.event.pull_request.number }}" ]; then
            echo "[*] Posting report to PR #${{ github.event.pull_request.number }}..."
            gh pr comment "${{ github.event.pull_request.number }}" --body-file "${{ inputs.report-path }}" || echo "[WARN] PR comment step failed or token lacks write permission."
          fi
        fi
