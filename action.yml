name: "LIFE FORGE AI Agent Flight Simulator"
description: "Autonomous evolutionary red-teaming and dynamic stress-testing gatekeeper for AI agents via 3D MAP-Elites. Modes: eval (red-team an agent), surface (failure-surface diff gate), mcp-scan (MCP tool-definition security scan)."
author: "Zarif Latif"
branding:
  icon: "shield"
  color: "cyan"

inputs:
  mode:
    description: "Gate mode: 'eval' (evolutionary red-team), 'surface' (failure-surface diff against a baseline), or 'mcp-scan' (MCP tool-definition security scan)"
    required: false
    default: "eval"

  # ---- Shared inputs -------------------------------------------------
  domain:
    description: "Built-in scenario domain (procurement, customer_support, devops, financial)"
    required: false
    default: ""
  domain-spec:
    description: "Path to a YAML/JSON custom domain specification (overrides 'domain')"
    required: false
    default: ""
  frontier:
    description: "Include 2026 frontier attacks (prompt worms, memory poisoning, context flood, multilingual)"
    required: false
    default: "false"
  scenarios:
    description: "Number of evolutionary generations to simulate"
    required: false
    default: "30"
  seed:
    description: "Deterministic random seed"
    required: false
    default: "42"
  fail-on-critical:
    description: "Fail the step (exit 1) when critical findings are present"
    required: false
    default: "true"
  report-path:
    description: "Output file path for the Markdown report"
    required: false
    default: "results/lifeforge_report.md"
  json:
    description: "Also generate a structured JSON report alongside the Markdown"
    required: false
    default: "true"
  comment-on-pr:
    description: "Post the report as a PR comment"
    required: false
    default: "true"
  github-token:
    description: "GitHub token for commenting on PRs and uploading summaries"
    required: false
    default: ${{ github.token }}

  # ---- eval mode inputs ----------------------------------------------
  target:
    description: "[eval] Target Python agent specifier (e.g. src/agent.py:my_agent or module:AgentClass)"
    required: false
    default: ""
  endpoint:
    description: "[eval] HTTP webhook URL to receive observations for external/Dockerized agents"
    required: false
    default: ""
  reset-endpoint:
    description: "[eval] Optional HTTP reset URL for external microservice agents"
    required: false
    default: ""
  timeout:
    description: "[eval] HTTP request timeout in seconds"
    required: false
    default: "30.0"
  agent-name:
    description: "[eval] Custom identifier for the evaluated agent"
    required: false
    default: ""
  delay:
    description: "[eval] Delay in seconds between generations"
    required: false
    default: "0.0"

  # ---- surface mode inputs -------------------------------------------
  surface-baseline:
    description: "[surface] Path to the baseline failure-surface snapshot (JSON)"
    required: false
    default: ""
  surface-save-current:
    description: "[surface] Where to save the current snapshot (e.g. results/agent_surface.json; commit it to update the baseline)"
    required: false
    default: ""
  surface-fail-on-regression:
    description: "[surface] Fail the step when the failure surface regressed"
    required: false
    default: "true"
  surface-agent-target:
    description: "[surface] Agent specifier to campaign against (falls back to 'target')"
    required: false
    default: ""
  surface-endpoint:
    description: "[surface] HTTP webhook agent to campaign against (falls back to 'endpoint')"
    required: false
    default: ""
  surface-agent-name:
    description: "[surface] Label for the built-in reference agent (e.g. 'hardened' reference)"
    required: false
    default: ""
  surface-hardened:
    description: "[surface] Campaign against the hardened built-in reference agent"
    required: false
    default: "false"
  surface-repeats:
    description: "[surface] Replays per recorded scenario (use >1 for sampled LLM agents; empty = as recorded)"
    required: false
    default: ""
  surface-tolerance:
    description: "[surface] Allowed rise in a scenario's failure/critical rate before it counts as regressed"
    required: false
    default: "0"

  # ---- mcp-scan mode inputs ------------------------------------------
  mcp-manifest:
    description: "[mcp-scan] Path to a JSON manifest of MCP tool definitions"
    required: false
    default: ""
  mcp-server:
    description: "[mcp-scan] Command launching an MCP server over stdio (e.g. 'python server.py')"
    required: false
    default: ""
  mcp-url:
    description: "[mcp-scan] HTTP URL of an MCP Streamable-HTTP endpoint"
    required: false
    default: ""
  mcp-baseline:
    description: "[mcp-scan] Approved baseline manifest for rug-pull (drift) detection"
    required: false
    default: ""
  mcp-timeout:
    description: "[mcp-scan] Per-request timeout in seconds for live probes"
    required: false
    default: "15.0"

outputs:
  report-path:
    description: "Path to the generated Markdown report"
    value: ${{ inputs.report-path }}
  surface-verdict:
    description: "[surface mode] REGRESSED, IMPROVED, or UNCHANGED"
    value: ${{ steps.run-surface.outputs.verdict }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install LIFE FORGE
      shell: bash
      run: |
        python -m pip install --upgrade pip
        if [ -f "${{ github.action_path }}/pyproject.toml" ]; then
          pip install "${{ github.action_path }}"
        else
          pip install git+https://github.com/zariffromlatif/life-forge.git
        fi

    # ---------------------------------------------------------------
    # Mode: eval (default) - evolutionary red-team of an agent
    # ---------------------------------------------------------------
    - name: Run LIFE FORGE Agent Evaluation
      id: run-eval
      if: ${{ inputs.mode == 'eval' }}
      shell: bash
      # Inputs travel through env and a bash array: never interpolated into the
      # script body (no injection) and never word-split (paths with spaces work).
      env:
        LF_SCENARIOS: ${{ inputs.scenarios }}
        LF_SEED: ${{ inputs.seed }}
        LF_DELAY: ${{ inputs.delay }}
        LF_REPORT: ${{ inputs.report-path }}
        LF_TARGET: ${{ inputs.target }}
        LF_ENDPOINT: ${{ inputs.endpoint }}
        LF_RESET_ENDPOINT: ${{ inputs.reset-endpoint }}
        LF_TIMEOUT: ${{ inputs.timeout }}
        LF_AGENT_NAME: ${{ inputs.agent-name }}
        LF_DOMAIN: ${{ inputs.domain }}
        LF_DOMAIN_SPEC: ${{ inputs.domain-spec }}
        LF_FRONTIER: ${{ inputs.frontier }}
        LF_JSON: ${{ inputs.json }}
        LF_FAIL_ON_CRITICAL: ${{ inputs.fail-on-critical }}
      run: |
        set -uo pipefail
        CMD=(python -m lifeforge.cli eval --scenarios "$LF_SCENARIOS" --seed "$LF_SEED" --delay "$LF_DELAY" --out "$LF_REPORT")
        if [ -n "$LF_TARGET" ]; then CMD+=(--target "$LF_TARGET"); fi
        if [ -n "$LF_ENDPOINT" ]; then CMD+=(--endpoint "$LF_ENDPOINT"); fi
        if [ -n "$LF_RESET_ENDPOINT" ]; then CMD+=(--reset-endpoint "$LF_RESET_ENDPOINT"); fi
        if [ -n "$LF_TIMEOUT" ]; then CMD+=(--timeout "$LF_TIMEOUT"); fi
        if [ -n "$LF_AGENT_NAME" ]; then CMD+=(--agent-name "$LF_AGENT_NAME"); fi
        if [ -n "$LF_DOMAIN" ]; then CMD+=(--domain "$LF_DOMAIN"); fi
        if [ -n "$LF_DOMAIN_SPEC" ]; then CMD+=(--domain-spec "$LF_DOMAIN_SPEC"); fi
        if [ "$LF_FRONTIER" = "true" ]; then CMD+=(--frontier); fi
        if [ "$LF_JSON" = "true" ]; then CMD+=(--json); fi
        if [ "$LF_FAIL_ON_CRITICAL" = "true" ]; then CMD+=(--fail-on-critical); fi
        echo "[*] Executing: ${CMD[*]}"
        "${CMD[@]}"

    # ---------------------------------------------------------------
    # Mode: surface - failure-surface diff gate
    # ---------------------------------------------------------------
    - name: Run LIFE FORGE Failure-Surface Gate
      id: run-surface
      if: ${{ inputs.mode == 'surface' }}
      shell: bash
      env:
        LF_BASELINE: ${{ inputs.surface-baseline }}
        LF_SCENARIOS: ${{ inputs.scenarios }}
        LF_SEED: ${{ inputs.seed }}
        LF_REPORT: ${{ inputs.report-path }}
        LF_TARGET: ${{ inputs.surface-agent-target || inputs.target }}
        LF_ENDPOINT: ${{ inputs.surface-endpoint || inputs.endpoint }}
        LF_HARDENED: ${{ inputs.surface-hardened }}
        LF_AGENT_NAME: ${{ inputs.surface-agent-name }}
        LF_SAVE_CURRENT: ${{ inputs.surface-save-current }}
        LF_DOMAIN: ${{ inputs.domain }}
        LF_DOMAIN_SPEC: ${{ inputs.domain-spec }}
        LF_FRONTIER: ${{ inputs.frontier }}
        LF_JSON: ${{ inputs.json }}
        LF_FAIL_ON_REGRESSION: ${{ inputs.surface-fail-on-regression }}
        LF_REPEATS: ${{ inputs.surface-repeats }}
        LF_TOLERANCE: ${{ inputs.surface-tolerance }}
      run: |
        set -uo pipefail
        if [ -z "$LF_BASELINE" ]; then
          echo "[FAIL] surface mode requires 'surface-baseline' (record one with: lifeforge surface --record --out results/agent_surface.json)"
          exit 1
        fi
        CMD=(python -m lifeforge.cli surface --baseline "$LF_BASELINE" --scenarios "$LF_SCENARIOS" --seed "$LF_SEED" --out "$LF_REPORT")
        if [ -n "$LF_TARGET" ]; then
          CMD+=(--target "$LF_TARGET")
        elif [ -n "$LF_ENDPOINT" ]; then
          CMD+=(--endpoint "$LF_ENDPOINT")
        elif [ "$LF_HARDENED" = "true" ]; then
          CMD+=(--hardened)
        elif [ -n "$LF_AGENT_NAME" ]; then
          CMD+=(--agent-name "$LF_AGENT_NAME")
        fi
        if [ -n "$LF_SAVE_CURRENT" ]; then CMD+=(--save-current "$LF_SAVE_CURRENT"); fi
        if [ -n "$LF_DOMAIN" ]; then CMD+=(--domain "$LF_DOMAIN"); fi
        if [ -n "$LF_DOMAIN_SPEC" ]; then CMD+=(--domain-spec "$LF_DOMAIN_SPEC"); fi
        if [ "$LF_FRONTIER" = "true" ]; then CMD+=(--frontier); fi
        if [ "$LF_JSON" = "true" ]; then CMD+=(--json); fi
        if [ "$LF_FAIL_ON_REGRESSION" = "true" ]; then CMD+=(--fail-on-regression); fi
        if [ -n "$LF_REPEATS" ]; then CMD+=(--repeats "$LF_REPEATS"); fi
        if [ -n "$LF_TOLERANCE" ]; then CMD+=(--tolerance "$LF_TOLERANCE"); fi
        echo "[*] Executing: ${CMD[*]}"
        "${CMD[@]}"

    - name: Export surface verdict
      if: ${{ inputs.mode == 'surface' && always() }}
      shell: bash
      env:
        LF_REPORT: ${{ inputs.report-path }}
      run: |
        VERDICT="UNKNOWN"
        if [ -f "$LF_REPORT" ]; then
          if grep -q "Verdict: REGRESSED" "$LF_REPORT"; then
            VERDICT="REGRESSED"
          elif grep -q "Verdict: IMPROVED" "$LF_REPORT"; then
            VERDICT="IMPROVED"
          elif grep -q "Verdict: UNCHANGED" "$LF_REPORT"; then
            VERDICT="UNCHANGED"
          fi
        fi
        echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
        echo "[*] Surface verdict: $VERDICT"

    # ---------------------------------------------------------------
    # Mode: mcp-scan - MCP tool-definition security scan
    # ---------------------------------------------------------------
    - name: Run LIFE FORGE MCP Security Scan
      id: run-mcp-scan
      if: ${{ inputs.mode == 'mcp-scan' }}
      shell: bash
      env:
        LF_REPORT: ${{ inputs.report-path }}
        LF_MANIFEST: ${{ inputs.mcp-manifest }}
        LF_SERVER: ${{ inputs.mcp-server }}
        LF_URL: ${{ inputs.mcp-url }}
        LF_BASELINE: ${{ inputs.mcp-baseline }}
        LF_TIMEOUT: ${{ inputs.mcp-timeout }}
        LF_JSON: ${{ inputs.json }}
        LF_FAIL_ON_CRITICAL: ${{ inputs.fail-on-critical }}
      run: |
        set -uo pipefail
        SOURCE_COUNT=0
        if [ -n "$LF_MANIFEST" ]; then SOURCE_COUNT=$((SOURCE_COUNT+1)); fi
        if [ -n "$LF_SERVER" ]; then SOURCE_COUNT=$((SOURCE_COUNT+1)); fi
        if [ -n "$LF_URL" ]; then SOURCE_COUNT=$((SOURCE_COUNT+1)); fi
        if [ "$SOURCE_COUNT" -ne 1 ]; then
          echo "[FAIL] mcp-scan mode requires exactly one of: mcp-manifest, mcp-server, mcp-url"
          exit 1
        fi
        CMD=(python -m lifeforge.cli mcp-scan --out "$LF_REPORT" --timeout "$LF_TIMEOUT")
        if [ -n "$LF_MANIFEST" ]; then
          CMD+=(--manifest "$LF_MANIFEST")
        elif [ -n "$LF_SERVER" ]; then
          # One argument: the CLI splits the server command line itself.
          CMD+=(--server "$LF_SERVER")
        else
          CMD+=(--url "$LF_URL")
        fi
        if [ -n "$LF_BASELINE" ]; then CMD+=(--baseline "$LF_BASELINE"); fi
        if [ "$LF_JSON" = "true" ]; then CMD+=(--json); fi
        if [ "$LF_FAIL_ON_CRITICAL" = "true" ]; then CMD+=(--fail-on-critical); fi
        echo "[*] Executing: ${CMD[*]}"
        "${CMD[@]}"

    # ---------------------------------------------------------------
    # Reporting (all modes)
    # ---------------------------------------------------------------
    - name: Publish Summary to GitHub Step Summary
      if: always()
      shell: bash
      env:
        LF_REPORT: ${{ inputs.report-path }}
        LF_MODE: ${{ inputs.mode }}
      run: |
        if [ -f "$LF_REPORT" ]; then
          echo "## LIFE FORGE Security Report (mode: $LF_MODE)" >> "$GITHUB_STEP_SUMMARY"
          cat "$LF_REPORT" >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Post PR Review Comment
      if: always()
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        LF_COMMENT: ${{ inputs.comment-on-pr }}
        LF_REPORT: ${{ inputs.report-path }}
        LF_EVENT: ${{ github.event_name }}
        LF_PR: ${{ github.event.pull_request.number }}
      run: |
        if [ "$LF_COMMENT" = "true" ] && [ "$LF_EVENT" = "pull_request" ]; then
          if [ -f "$LF_REPORT" ] && [ -n "$LF_PR" ]; then
            echo "[*] Posting report to PR #$LF_PR..."
            # GitHub rejects comment bodies over 65536 characters.
            BODY="$RUNNER_TEMP/lifeforge_comment.md"
            head -c 60000 "$LF_REPORT" > "$BODY"
            # Edit our previous comment instead of adding one per push.
            gh pr comment "$LF_PR" --body-file "$BODY" --edit-last 2>/dev/null \
              || gh pr comment "$LF_PR" --body-file "$BODY" \
              || echo "[WARN] PR comment step failed or token lacks write permission."
          fi
        fi
